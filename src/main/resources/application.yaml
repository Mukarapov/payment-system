spring:
  application:
    name: payment-system

  datasource:
    url: jdbc:postgresql://localhost:5433/payments
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate


    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: info